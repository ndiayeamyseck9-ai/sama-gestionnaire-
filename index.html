<meta name="theme-color" content="#177a3c">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f1eb;--card:#fff;--ink:#0f2a1b;--mute:#5b7365;--line:#d3e2d8;--g:#177a3c;--g2:#0f5c2c;--soft:#dcebe1;--warn:#ebe9c8;--wl:#f2c230;--red:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b13;--card:#162a1e;--ink:#e8f3ec;--mute:#93ad9f;--line:#27402f;--soft:#1d3527;--warn:#3a3818;--red:#f87171}}
:root[data-theme="dark"]{--bg:#0d1b13;--card:#162a1e;--ink:#e8f3ec;--mute:#93ad9f;--line:#27402f;--soft:#1d3527;--warn:#3a3818;--red:#f87171}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",system-ui,sans-serif;max-width:560px;margin:0 auto;padding:0 16px 150px}
header{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.logo{width:34px;height:34px;border-radius:50%;background:var(--wl);border:3px solid var(--g2);display:grid;place-items:center;font-weight:800;color:var(--g2)}
h1{font:700 24px "Playfair Display",Georgia,serif;color:var(--g);margin:0}
.hero{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;border-radius:26px;padding:22px}
.lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.big{font-size:38px;font-weight:800;margin:6px 0 14px}
.two{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.3);padding-top:12px}
.two b{font-size:20px;display:block}
.alert{background:var(--warn);border:2px solid var(--wl);border-radius:16px;padding:14px;margin:14px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn{border:0;border-radius:16px;padding:16px;font:inherit;font-weight:700;font-size:18px;background:var(--soft);color:var(--ink)}
.btn.p{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:20px;padding:16px}
.card .lab{color:var(--mute);opacity:1}.card b{display:block;font-size:24px;margin:4px 0}.card small{color:var(--mute)}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:22px 2px 8px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{background:var(--card);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
li .t{flex:1;min-width:0}li .t b{display:block;overflow-wrap:anywhere}li small{color:var(--mute)}
.pl{color:var(--g);font-weight:700;white-space:nowrap}.mi{color:var(--red);font-weight:700;white-space:nowrap}
.empty{color:var(--mute);text-align:center;border:2px dashed var(--line);border-radius:16px;padding:22px 10px;display:block}
form{background:var(--card);border-radius:20px;padding:14px;display:grid;gap:10px}
label{font-size:13px;color:var(--mute);display:grid;gap:4px}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.seg{display:grid;grid-auto-flow:column;gap:8px}.seg label{padding:11px;border:1px solid var(--line);border-radius:12px;text-align:center;font-weight:600;color:var(--ink)}
.seg input{display:none}.seg label:has(input:checked){background:var(--g);color:#fff;border-color:var(--g)}
.sm{border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-weight:600}
.x{border:0;background:none;color:var(--mute);font-size:22px;padding:2px 8px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:34px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:13px;display:grid;gap:2px;justify-items:center;padding:4px}
nav button span{font-size:22px;line-height:1}nav button[aria-current=true]{color:var(--g);font-weight:700}
.mn{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--card);color:var(--ink);border-radius:22px;padding:24px 20px;font:inherit;font-weight:700;font-size:20px;margin-bottom:12px;text-align:left}.mn i{font-style:normal;color:var(--mute)}
h3.pt{font-size:32px;margin:18px 0 14px}.back{border:0;background:none;color:var(--g);font:inherit;font-weight:700;padding:6px 0}
.row2{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px}.pc{background:var(--card);border-radius:24px;padding:18px 20px;margin-bottom:14px}.pr{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.pn{font-size:20px}.pr .mi,.pr .pl{font-size:20px}.sub{color:var(--mute);margin-top:6px}.pk{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;gap:18px}.lk{border:0;background:none;font:inherit;text-decoration:underline;color:var(--ink);padding:0}.lk.r{color:var(--red)}
.ra{display:flex;gap:8px;margin-top:8px}.ra .sm{padding:6px 12px;font-size:14px}
#rc{display:none}
.mdb{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:50}.mdc{background:var(--card);border-radius:20px;padding:18px;display:grid;gap:10px;width:100%;max-width:420px;max-height:90vh;overflow:auto}.mdc pre{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;margin:0;font:15px/1.4 monospace}.mdc a.btn{display:block;text-align:center;text-decoration:none}
@media print{body{background:#fff!important;padding:0}body>*:not(#rc){display:none!important}#rc{display:block;white-space:pre-wrap;font:18px/1.5 monospace;color:#000;background:#fff;padding:12px}}
.inst{background:var(--card);border:2px solid var(--wl);border-radius:16px;padding:12px 14px;margin:4px 0 14px;display:flex;gap:10px;align-items:flex-start;font-size:15px}.inst div{flex:1}.inst[hidden]{display:none}.inst small{color:var(--mute);display:block;margin-top:4px}
:focus-visible{outline:3px solid var(--wl);outline-offset:2px}
</style>
</head>
<body>
<header><div class="logo">✕</div><h1>Sama Gestionnaire</h1></header>
<div id="inst" class="inst" hidden><div><b>📲 Installer l’application</b><br>iPhone : touchez Partager, puis « Sur l’écran d’accueil ».<br>Android : touchez ⋮, puis « Installer l’application ».<small>Vos données restent privées, enregistrées uniquement sur votre téléphone.</small></div><button class="x" id="instx" aria-label="Fermer">×</button></div>
<div id="v"></div>
<div id="rc"></div>
<div id="md"></div>
<button class="fab" id="fab" aria-label="Nouvelle vente">+</button>
<nav><div id="nav"></div></nav>
<script>
var S={st:[],ops:[],fo:[]},tab="home",sub="",ed=null;
try{var r=localStorage.getItem("sama_public_v1");if(r)S=JSON.parse(r)}catch(e){}
function save(){S.u=Date.now();try{localStorage.setItem("sama_public_v1",JSON.stringify(S))}catch(e){}}
function f(n){return Number(n).toLocaleString("fr-FR")+" FCFA"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function day(){return new Date().toLocaleDateString("fr-FR")}
function $(i){return document.getElementById(i)}
function calc(){
var c={caisse:0,poche:0,ca:0,enc:0,wave:0,cre:0,dep:0,nv:0};
S.ops.forEach(function(o){
if(o.t=="v"){c.ca+=o.m;c.nv++;
if(o.mode=="cred"){if(o.paid){c.caisse+=o.m;c.enc+=o.m}else c.cre+=o.m}
else{c.caisse+=o.m;c.enc+=o.m;if(o.mode=="wave")c.wave+=o.m}}
else if(o.t=="d"){c.dep+=o.m;if(o.src=="poche")c.poche-=o.m;else c.caisse-=o.m}
else if(o.t=="t"){if(o.dir=="cp"){c.caisse-=o.m;c.poche+=o.m}else{c.poche-=o.m;c.caisse+=o.m}}
});return c}
function low(){return S.st.filter(function(p){return p.q<=p.s})}
function opLi(o){
var l,a,p=true;
if(o.t=="v"){l=o.l;a=o.m;p=true}
else if(o.t=="d"){l=o.l;a=o.m;p=false}
else{l=o.dir=="cp"?"Caisse → Poche":"Poche → Caisse";a=o.m;p=true}
var sub=o.d+(o.t=="v"?" · "+({esp:"Espèces",wave:"Wave / OM",cred:o.paid?"Crédit payé":"Crédit"}[o.mode])+(o.cl?" · "+esc(o.cl):""):o.t=="d"?" · "+(o.src=="poche"?"Poche":"Caisse"):"");
return '<li><div class="t"><b>'+esc(l)+'</b><small>'+sub+'</small>'+(o.t=="v"?'<div class="ra"><button class="sm" data-wa="'+o.id+'">Envoyer</button><button class="sm" data-pr="'+o.id+'">Imprimer</button></div>':'')+'</div><span class="'+(p?"pl":"mi")+'">'+(p?"":"−")+f(a)+'</span><button class="x" aria-label="Supprimer" data-del="'+o.id+'">×</button></li>'}
function home(){
var c=calc(),a=low(),h='<section class="hero"><div class="lab">Solde disponible total</div><div class="big">'+f(c.caisse+c.poche)+'</div><div class="two"><div><span class="lab">Ma caisse</span><b>'+Number(c.caisse).toLocaleString("fr-FR")+'</b></div><div style="text-align:right"><span class="lab">Ma poche</span><b>'+Number(c.poche).toLocaleString("fr-FR")+'</b></div></div></section>';
if(a.length)h+='<div class="alert">'+a.length+' produit'+(a.length>1?"s":"")+' en alerte stock : '+a.map(function(p){return esc(p.n)}).join(", ")+'. Pensez à réapprovisionner.</div>';
h+='<div class="btns" style="margin-top:14px"><button class="btn p" data-go="vente">Nouvelle vente</button><button class="btn" data-go="dep">Dépense</button></div><div class="grid">'+
'<div class="card"><span class="lab">Chiffre d’affaires</span><b>'+f(c.ca)+'</b><small>'+c.nv+' vente'+(c.nv>1?"s":"")+'</small></div>'+
'<div class="card"><span class="lab">Encaissements</span><b>'+f(c.enc)+'</b><small>dont '+Number(c.wave).toLocaleString("fr-FR")+' Wave / OM</small></div>'+
'<div class="card"><span class="lab">Créances</span><b>'+f(c.cre)+'</b></div>'+
'<div class="card"><span class="lab">Dépenses</span><b>'+f(c.dep)+'</b></div></div><h2>Dernières opérations</h2>';
var o=S.ops.slice(-5).reverse().map(opLi).join("");
return h+(o?'<ul>'+o+'</ul>':'<span class="empty">Aucune opération. Ajoute ta première vente.</span>')}
function vente(){
var o=S.st.map(function(p){return'<option value="'+p.id+'">'+esc(p.n)+' ('+p.q+' en stock)</option>'}).join("");
return'<h2>Nouvelle vente</h2><form id="fv"><label>Produit<select id="vp">'+o+'<option value="0">Autre produit</option></select></label>'+
'<label>Description (si autre produit)<input id="vl" maxlength="50"></label><label>Quantité<input id="vq" type="number" inputmode="numeric" min="1" value="1"></label>'+
'<label>Prix unitaire (FCFA)<input id="vm" type="number" inputmode="numeric" min="1" required></label>'+
'<div class="seg"><label><input type="radio" name="mode" value="esp" checked><span>Espèces</span></label><label><input type="radio" name="mode" value="wave"><span>Wave / OM</span></label><label><input type="radio" name="mode" value="cred"><span>Crédit</span></label></div>'+
'<label>Nom du client (obligatoire pour un crédit)<input id="vc" maxlength="40"></label><label>Téléphone du client (facultatif)<input id="vt" type="tel" inputmode="tel" maxlength="20" placeholder="ex : 77 123 45 67"></label><button class="btn p">Enregistrer la vente</button></form><h2>Dernières ventes</h2>'+
lst(function(o){return o.t=="v"},"Aucune vente pour le moment.")}
function lst(fn,e){var o=S.ops.filter(fn).slice().reverse().map(opLi).join("");return o?'<ul>'+o+'</ul>':'<span class="empty">'+e+'</span>'}
function dep(){
return'<h2>Nouvelle dépense</h2><form id="fd"><label>Description<input id="dl" required maxlength="50" placeholder="ex : transport, loyer"></label><label>Montant (FCFA)<input id="dm" type="number" inputmode="numeric" min="1" required></label>'+
'<div class="seg"><label><input type="radio" name="src" value="caisse" checked><span>Ma caisse</span></label><label><input type="radio" name="src" value="poche"><span>Ma poche</span></label></div><button class="btn p">Enregistrer la dépense</button></form><h2>Dépenses</h2>'+
lst(function(o){return o.t=="d"},"Aucune dépense pour le moment.")}
function pg(t,b){return(sub?'<button class="back" data-sub="">← Plus</button>':'')+'<h3 class="pt">'+t+'</h3>'+b}
function plusM(){
if(!sub)return pg("Plus",[["tres","Trésorerie"],["cli","Clients"],["four","Fournisseurs"],["rap","Rapports"]].map(function(m){return'<button class="mn" data-sub="'+m[0]+'">'+m[1]+'<i>›</i></button>'}).join(""));
var c=calc();
if(sub=="tres")return pg("Trésorerie",'<div class="grid"><div class="card"><span class="lab">Ma caisse</span><b>'+f(c.caisse)+'</b></div><div class="card"><span class="lab">Ma poche</span><b>'+f(c.poche)+'</b></div></div><h2>Transférer de l’argent</h2><form id="ft"><label>Montant (FCFA)<input id="tm" type="number" inputmode="numeric" min="1" required></label><div class="seg"><label><input type="radio" name="dir" value="cp" checked><span>Caisse → Poche</span></label><label><input type="radio" name="dir" value="pc"><span>Poche → Caisse</span></label></div><button class="btn p">Transférer</button></form><h2>Transferts</h2>'+lst(function(o){return o.t=="t"},"Aucun transfert."));
if(sub=="cli"){var g={};S.ops.forEach(function(o){if(o.t=="v"&&o.cl){var k=o.cl.toLowerCase();g[k]=g[k]||{n:o.cl,tot:0,du:0};g[k].tot+=o.m;if(o.mode=="cred"&&!o.paid)g[k].du+=o.m}});
var gl=Object.keys(g).map(function(k){return'<li><div class="t"><b>'+esc(g[k].n)+'</b><small>Total acheté : '+f(g[k].tot)+'</small></div>'+(g[k].du?'<span class="mi">Doit '+f(g[k].du)+'</span>':'<small>À jour</small>')+'</li>'}).join("");
var cr=S.ops.filter(function(o){return o.t=="v"&&o.mode=="cred"&&!o.paid}).map(function(o){return'<li><div class="t"><b>'+esc(o.cl)+'</b><small>'+esc(o.l)+' · '+o.d+'</small></div><span class="mi">'+f(o.m)+'</span><button class="sm" data-paid="'+o.id+'">A payé</button></li>'}).join("");
return pg("Clients",'<h2>Qui me doit ? ('+f(c.cre)+')</h2>'+(cr?'<ul>'+cr+'</ul>':'<span class="empty">Personne ne te doit d’argent.</span>')+'<h2>Tous mes clients</h2>'+(gl?'<ul>'+gl+'</ul>':'<span class="empty">Les clients apparaissent quand tu écris un nom dans une vente.</span>'))}
if(sub=="four"){var tot=0,fl=S.fo.map(function(x){tot+=x.m;return'<li><div class="t"><b>'+esc(x.n)+'</b><small>'+esc(x.note||"")+' '+x.d+'</small></div><span class="mi">'+f(x.m)+'</span><button class="sm" data-fpay="'+x.id+'">Payé</button><button class="x" aria-label="Supprimer" data-fdel="'+x.id+'">×</button></li>'}).join("");
return pg("Fournisseurs",'<form id="ff"><label>Nom du fournisseur<input id="fn" required maxlength="40"></label><label>Je lui dois (FCFA)<input id="fm" type="number" inputmode="numeric" min="1" required></label><label>Note (facultatif)<input id="fx" maxlength="50"></label><button class="btn p">Ajouter</button></form><h2>Je dois '+f(tot)+'</h2>'+(fl?'<ul>'+fl+'</ul>':'<span class="empty">Tu ne dois rien à tes fournisseurs.</span>')+'<p><small>Le bouton Payé enregistre une dépense depuis ta caisse.</small></p>')}
var d=day(),td={v:0,d:0};S.ops.forEach(function(o){if(o.d==d){if(o.t=="v")td.v+=o.m;if(o.t=="d")td.d+=o.m}});
function R(a,b,cl){return'<div class="row2"><span>'+a+'</span><b'+(cl?' class="'+cl+'"':'')+'>'+f(b)+'</b></div>'}
return pg("Rapports",'<h2>Aujourd’hui</h2><div class="card">'+R("Ventes",td.v)+R("Dépenses",td.d)+R("Résultat",td.v-td.d,td.v-td.d<0?"mi":"pl")+'</div><h2>Depuis le début</h2><div class="card">'+R("Chiffre d’affaires",c.ca)+R("Encaissements",c.enc)+R("Créances à recevoir",c.cre)+R("Dépenses",c.dep)+R("Résultat (ventes − dépenses)",c.ca-c.dep,c.ca-c.dep<0?"mi":"pl")+'</div><h2>Stock en alerte</h2>'+(low().length?'<ul>'+low().map(function(p){return'<li><div class="t"><b>'+esc(p.n)+'</b></div><span class="mi">'+p.q+' restant</span></li>'}).join("")+'</ul>':'<span class="empty">Aucun produit en alerte.</span>'))}
function stock(){
var h='<div class="ph"><h3 class="pt">Produits</h3><button class="btn p" style="padding:12px 18px;font-size:17px" data-pnew="">Nouveau produit</button></div>';
if(ed){var e=ed=="new"?{}:(S.st.filter(function(x){return x.id==ed})[0]||{});
function N(i,l,v){return'<label>'+l+'<input id="'+i+'" type="number" inputmode="numeric" min="0" value="'+(v||0)+'"></label>'}
h+='<form id="fs"><label>Nom du produit<input id="sn" required maxlength="50" value="'+esc(e.n||"")+'"></label><label>Catégorie<input id="sc" maxlength="30" placeholder="ex : Beauté" value="'+esc(e.c||"")+'"></label>'+N("sq","Quantité en stock",e.q)+N("ss","Alerte quand il en reste (min)",e.s)+N("sa","Prix d’achat (FCFA)",e.a)+N("sv","Prix de vente (FCFA)",e.p)+'<button class="btn p">Enregistrer</button><button type="button" class="btn" data-pcancel="">Annuler</button></form><div style="height:14px"></div>'}
h+=S.st.map(function(p,i){var lw=p.q<=p.s;
return'<div class="pc"><div class="pr"><b class="pn">'+esc(p.n)+'</b><b class="'+(lw?"mi":"pl")+'">'+p.q+' unité'+(p.q>1?"s":"")+'</b></div><div class="pr sub"><span>PRD'+String(i+1).padStart(3,"0")+' · '+esc(p.c||"Général")+'</span><span>Min : '+p.s+'</span></div><div class="pr sub"><span>Achat : '+f(p.a||0)+'</span><span>Vente : '+f(p.p||0)+'</span></div><div class="pk"><button class="lk" data-pedit="'+p.id+'">Modifier</button><button class="lk r" data-sp="'+p.id+'">Supprimer</button></div></div>'}).join("");
return h||'<span class="empty">Aucun produit.</span>'}
var T=[["home","⌂","Accueil"],["vente","🛒","Vente"],["dep","👛","Dépenses"],["stock","📦","Stock"],["plus","⋯","Plus"]];
function render(){
S.fo=S.fo||[];
$("nav").innerHTML=T.map(function(t){return'<button data-go="'+t[0]+'" aria-current="'+(t[0]==tab)+'"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("");
$("v").innerHTML={home:home,vente:vente,dep:dep,stock:stock,plus:plusM}[tab]();
$("fab").style.display=tab=="vente"?"none":"block";
var fv=$("fv");if(fv){var sync=function(){var p=S.st.filter(function(x){return x.id==$("vp").value})[0];$("vl").disabled=!!p;if(p&&p.p)$("vm").value=p.p};$("vp").onchange=sync;sync()}}
function rcp(o){var rest=o.mode=="cred"&&!o.paid;return["SAMA GESTIONNAIRE","Reçu du "+o.d,"--------------------"].concat(o.cl?["Client : "+o.cl]:[],["Article : "+o.l,"Total : "+f(o.m),"Paiement : "+({esp:"Espèces",wave:"Wave / OM",cred:"Crédit"}[o.mode]),rest?"Reste à payer : "+f(o.m):"Payé. Merci !"]).join("\n")}
var cur="",curId=0;
document.addEventListener("input",function(e){if(e.target.id!="mt")return;var n=e.target.value.replace(/\D/g,"").replace(/^00/,"");if(n.length==9)n="221"+n;$("wal").href="https://wa.me/"+n+"?text="+encodeURIComponent(cur);var o=S.ops.filter(function(x){return x.id==curId})[0];if(o){o.tel=e.target.value.trim();save()}});
function openR(id){var o=S.ops.filter(function(x){return x.id==id})[0];if(!o)return;cur=rcp(o);curId=id;var n=(o.tel||"").replace(/\D/g,"").replace(/^00/,"");if(n.length==9)n="221"+n;var e=encodeURIComponent(cur);
$("md").innerHTML='<div class="mdb"><div class="mdc"><b>Reçu</b><pre>'+esc(cur)+'</pre>'+(o.tel?'':'<label>Numéro WhatsApp du client<input id="mt" type="tel" inputmode="tel" placeholder="ex : 77 123 45 67"></label>')+'<a id="wal" class="btn p" href="https://wa.me/'+n+'?text='+e+'" target="_blank" rel="noopener">Envoyer par WhatsApp</a><a class="btn" href="sms:'+n+'?&body='+e+'">Envoyer par SMS</a><button class="btn" data-cp="1">Copier le reçu</button><button class="btn" data-sh="1">Partager</button><button class="btn" data-ip="1">Imprimer</button><button class="btn" data-cl="1">Fermer</button></div></div>'}
function cpy(b){var ok=function(){b.textContent="Copié ✓"},fb=function(){var a=document.createElement("textarea");a.value=cur;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){b.textContent="Copie impossible"}a.remove()};try{navigator.clipboard.writeText(cur).then(ok,fb)}catch(e){fb()}}
function add(o){o.id=Date.now()+Math.floor(Math.random()*1000);o.d=day();S.ops.push(o);save()}
document.addEventListener("submit",function(e){
e.preventDefault();var id=e.target.id;
if(id=="fv"){var p=S.st.filter(function(x){return x.id==$("vp").value})[0],q=parseInt($("vq").value,10)||1,u=parseInt($("vm").value,10),mode=document.querySelector("input[name=mode]:checked").value,cl=$("vc").value.trim(),tel=$("vt").value.trim();
if(!u)return;if(mode=="cred"&&!cl){$("vc").focus();$("vc").placeholder="Nom requis pour un crédit";return}
var l=p?p.n:($("vl").value.trim()||"Vente");if(q>1)l+=" ×"+q;if(p)p.q=Math.max(0,p.q-q);
add({t:"v",l:l,m:u*q,mode:mode,cl:cl,tel:tel,paid:false});if(p){p.p=u}tab="home"}
if(id=="fd"){add({t:"d",l:$("dl").value.trim(),m:parseInt($("dm").value,10),src:document.querySelector("input[name=src]:checked").value});tab="home"}
if(id=="fs"){var o={n:$("sn").value.trim(),c:$("sc").value.trim(),q:parseInt($("sq").value,10)||0,s:parseInt($("ss").value,10)||0,a:parseInt($("sa").value,10)||0,p:parseInt($("sv").value,10)||0};
if(ed&&ed!="new"){S.st.forEach(function(p){if(p.id==ed)Object.assign(p,o)})}else{o.id=Date.now();S.st.push(o)}
ed=null;save()}
if(id=="ff"){S.fo.push({id:Date.now(),n:$("fn").value.trim(),m:parseInt($("fm").value,10),note:$("fx").value.trim(),d:day()});save()}
if(id=="ft"){add({t:"t",m:parseInt($("tm").value,10),dir:document.querySelector("input[name=dir]:checked").value});tab="home"}
render()});
document.addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;var d=b.dataset;
if(d.sub!==undefined&&!d.go){sub=d.sub;window.scrollTo(0,0)}
else if(d.fpay){var x=S.fo.filter(function(y){return y.id==d.fpay})[0];if(x){add({t:"d",l:"Paiement "+x.n,m:x.m,src:"caisse"});S.fo=S.fo.filter(function(y){return y.id!=d.fpay});save()}}
else if(d.pnew!==undefined){ed="new";window.scrollTo(0,0)}
else if(d.pedit){ed=d.pedit;window.scrollTo(0,0)}
else if(d.pcancel!==undefined){ed=null}
else if(d.fdel){S.fo=S.fo.filter(function(y){return y.id!=d.fdel});save()}
else if(d.cl!==undefined){$("md").innerHTML="";return}
else if(d.cp){cpy(b);return}
else if(d.sh){if(navigator.share)navigator.share({text:cur}).catch(function(){});else b.textContent="Partage impossible";return}
else if(d.ip){$("rc").textContent=cur;try{window.print()}catch(x){b.textContent="Impression bloquée"}return}
else if(d.wa){openR(d.wa);return}
else if(d.pr){openR(d.pr);return}
else if(d.go){tab=d.go;sub="";ed=null;window.scrollTo(0,0)}
else if(d.del){S.ops=S.ops.filter(function(o){return o.id!=d.del});save()}
else if(d.paid){S.ops.forEach(function(o){if(o.id==d.paid)o.paid=true});save()}
else if(d.sp){S.st=S.st.filter(function(p){return p.id!=d.sp});save()}
else if(d.q){var a=d.q.split("|");S.st.forEach(function(p){if(p.id==a[0])p.q=Math.max(0,p.q+parseInt(a[1],10))});save()}
else if(b.id=="fab")tab="vente";else return;
render()});
try{if(!localStorage.getItem("sama_inst")){$("inst").hidden=false}}catch(e){$("inst").hidden=false}
$("instx").addEventListener("click",function(){$("inst").hidden=true;try{localStorage.setItem("sama_inst","1")}catch(e){}});
render();
</script>
</body>
</html>
